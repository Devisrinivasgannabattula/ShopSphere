<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>Admin Login</title>

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#141e30,#243b55);
    padding:20px;
}

/* LOGIN BOX */

.login-box{
    width:100%;
    max-width:400px;
    background:white;
    padding:40px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
    text-align:center;
}

.login-box h1{
    color:#243b55;
    margin-bottom:10px;
    font-size:32px;
}

.subtitle{
    color:gray;
    margin-bottom:30px;
    font-size:15px;
}

/* INPUT BOX */

.input-box{
    margin-bottom:20px;
    text-align:left;
    position:relative;
}

.input-box label{
    font-size:16px;
    font-weight:bold;
    color:#333;
}

.input-box input{
    width:100%;
    padding:12px;
    margin-top:8px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
    outline:none;
    transition:0.3s;
}

/* PASSWORD INPUT */

.password-box input{
    padding-right:45px;
}

.toggle-password{
    position:absolute;
    right:15px;
    top:47px;
    color:#555;
    cursor:pointer;
    font-size:16px;
}

/* FOCUS */

.input-box input:focus{
    border-color:#243b55;
    box-shadow:0 0 8px rgba(36,59,85,0.4);
}

/* LOGIN BUTTON */

.login-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#243b55;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.login-btn:hover{
    background:#141e30;
    transform:scale(1.03);
}

/* BACK LINK */

.back{
    display:inline-block;
    margin-top:20px;
    text-decoration:none;
    color:#243b55;
    font-weight:bold;
}

.back:hover{
    text-decoration:underline;
}

/* RESPONSIVE */

@media(max-width:768px){

    .login-box{
        padding:30px;
    }

    .login-box h1{
        font-size:28px;
    }

}

@media(max-width:480px){

    body{
        padding:15px;
    }

    .login-box{
        padding:25px 20px;
        border-radius:16px;
    }

    .login-box h1{
        font-size:24px;
    }

    .subtitle{
        font-size:14px;
    }

    .input-box label{
        font-size:14px;
    }

    .input-box input{
        font-size:14px;
        padding:11px;
    }

    .password-box input{
        padding-right:40px;
    }

    .toggle-password{
        top:44px;
        right:12px;
        font-size:14px;
    }

    .login-btn{
        font-size:16px;
        padding:12px;
    }

    .back{
        font-size:14px;
    }

}

</style>

</head>

<body>

<div class="login-box">

    <h1>Admin Login</h1>

    <p class="subtitle">
        Login to manage ecommerce portal
    </p>

    <form action="adminlogin" method="post">

        <div class="input-box">

            <label>User Name</label>

            <input type="text"
            name="uname"
            placeholder="Enter Username">

        </div>

        <div class="input-box password-box">

            <label>Password</label>

            <input type="password"
            name="upwd"
            id="password"
            placeholder="Enter Password">

            <i class="fa-solid fa-eye toggle-password"
            id="eye"
            onclick="togglePassword()"></i>

        </div>

        <input type="submit"
        value="Login"
        class="login-btn">

    </form>

    <a href="index.html"
    class="back">

        Back to Home

    </a>

</div>

<script>

function togglePassword(){

    let password =
    document.getElementById("password");

    let eye =
    document.getElementById("eye");

    if(password.type === "password"){

        password.type = "text";

        eye.classList.remove("fa-eye");

        eye.classList.add("fa-eye-slash");
    }
    else{

        password.type = "password";

        eye.classList.remove("fa-eye-slash");

        eye.classList.add("fa-eye");
    }
}

</script>

</body>
</html>
