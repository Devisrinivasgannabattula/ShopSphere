<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration Page</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b,#2563eb);
    overflow-x:hidden;
    position:relative;
    padding:20px;
}

/* Animated Background Circles */

body::before,
body::after{
    content:"";
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,0.08);
    animation:float 8s infinite ease-in-out;
    z-index:0;
}

body::before{
    width:320px;
    height:320px;
    top:-100px;
    left:-80px;
}

body::after{
    width:250px;
    height:250px;
    bottom:-80px;
    right:-60px;
    animation-delay:2s;
}

@keyframes float{
    0%{
        transform:translateY(0px);
    }
    50%{
        transform:translateY(25px);
    }
    100%{
        transform:translateY(0px);
    }
}

/* Main Container */

.register-box{
    width:100%;
    max-width:430px;
    padding:40px;
    border-radius:25px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,0.2);
    box-shadow:0 15px 35px rgba(0,0,0,0.35);
    position:relative;
    z-index:1;
    animation:fadeIn 1s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.register-box h1{
    text-align:center;
    color:white;
    margin-bottom:30px;
    font-size:34px;
    font-weight:700;
    letter-spacing:1px;
}

.input-box{
    margin-bottom:20px;
    position:relative;
}

.input-box input{
    width:100%;
    padding:14px 18px;
    border:none;
    outline:none;
    border-radius:12px;
    background:rgba(255,255,255,0.15);
    color:white;
    font-size:15px;
    transition:0.3s;
    border:1px solid transparent;
}

.input-box input::placeholder{
    color:#dbeafe;
}

.input-box input:focus{
    border:1px solid #60a5fa;
    background:rgba(255,255,255,0.22);
    transform:scale(1.02);
    box-shadow:0 0 15px rgba(96,165,250,0.6);
}

/* Register Button */

.btn{
    width:100%;
    padding:14px;
    border:none;
    outline:none;
    border-radius:14px;
    background:linear-gradient(135deg,#3b82f6,#06b6d4);
    color:white;
    font-size:17px;
    font-weight:600;
    cursor:pointer;
    transition:0.4s;
    letter-spacing:1px;
}

.btn:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 25px rgba(37,99,235,0.5);
    background:linear-gradient(135deg,#2563eb,#0891b2);
}

.bottom-text{
    margin-top:18px;
    text-align:center;
    color:#dbeafe;
    font-size:14px;
    line-height:1.5;
}

.bottom-text a{
    color:white;
    text-decoration:none;
    font-weight:600;
}

.bottom-text a:hover{
    text-decoration:underline;
}

/* ========================= */
/* Responsive Design */
/* ========================= */

@media(max-width:768px){

    .register-box{
        padding:30px 25px;
        border-radius:20px;
    }

    .register-box h1{
        font-size:28px;
        margin-bottom:25px;
    }

    .input-box input{
        padding:13px 16px;
        font-size:14px;
    }

    .btn{
        padding:13px;
        font-size:16px;
    }
}

@media(max-width:480px){

    body{
        padding:15px;
        align-items:flex-start;
    }

    .register-box{
        margin-top:20px;
        padding:25px 18px;
        border-radius:18px;
    }

    .register-box h1{
        font-size:24px;
    }

    .input-box{
        margin-bottom:16px;
    }

    .input-box input{
        padding:12px 14px;
        font-size:13px;
        border-radius:10px;
    }

    .btn{
        padding:12px;
        font-size:15px;
        border-radius:12px;
    }

    .bottom-text{
        font-size:13px;
    }

    body::before{
        width:220px;
        height:220px;
    }

    body::after{
        width:180px;
        height:180px;
    }
}

</style>
</head>

<body>

<div class="register-box">

    <h1>Register Now</h1>

    <form action="reg" method="post">

        <div class="input-box">
            <input type="text" name="uname" placeholder="Enter Username" required>
        </div>

        <div class="input-box">
            <input type="password" name="pwd" placeholder="Enter Password" required>
        </div>

        <div class="input-box">
            <input type="text" name="fname" placeholder="Enter First Name" required>
        </div>

        <div class="input-box">
            <input type="text" name="lname" placeholder="Enter Last Name" required>
        </div>
        
        <div class="input-box">
            <input type="text" name="addr" placeholder="Enter Address" required>
        </div>

        <div class="input-box">
            <input type="email" name="mid" placeholder="Enter Email Address" required>
        </div>

        <div class="input-box">
            <input type="text" name="phone" placeholder="Enter Phone Number" required>
        </div>

        <input type="submit" value="Create Account" class="btn">

    </form>

    <div class="bottom-text">
        Already have an account?
        <a href="CustomerLogin.html">Login</a>
    </div>

</div>

</body>
</html>
