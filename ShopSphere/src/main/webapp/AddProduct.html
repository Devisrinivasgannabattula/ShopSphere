<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>Add Product</title>

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

*{
	margin:0;
	padding:0;
	box-sizing:border-box;
	font-family:'Poppins',sans-serif;
}

body{
	min-height:100vh;
	display:flex;
	justify-content:center;
	align-items:center;
	background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
	overflow-x:hidden;
	position:relative;
	padding:20px;
}

/* Animated Circles */

body::before{
	content:"";
	position:absolute;
	width:400px;
	height:400px;
	background:rgba(255,255,255,0.05);
	border-radius:50%;
	top:-120px;
	left:-120px;
	animation:move1 7s infinite alternate;
}

body::after{
	content:"";
	position:absolute;
	width:350px;
	height:350px;
	background:rgba(255,255,255,0.04);
	border-radius:50%;
	bottom:-100px;
	right:-100px;
	animation:move2 8s infinite alternate;
}

@keyframes move1{
	100%{
		transform:translate(60px,60px);
	}
}

@keyframes move2{
	100%{
		transform:translate(-60px,-60px);
	}
}

/* Marquee */

.marquee{
	position:absolute;
	top:20px;
	left:0;
	width:100%;
	overflow:hidden;
	white-space:nowrap;
	z-index:0;
	pointer-events:none;
}

.marquee span{
	display:inline-block;
	padding-left:100%;
	font-size:38px;
	font-weight:700;
	color:rgba(255,255,255,0.12);
	animation:marquee 15s linear infinite;
}

@keyframes marquee{
	100%{
		transform:translateX(-100%);
	}
}

/* Form Card */

.container{
	width:100%;
	max-width:480px;
	padding:40px;
	border-radius:25px;
	background:rgba(255,255,255,0.12);
	backdrop-filter:blur(12px);
	box-shadow:0 10px 35px rgba(0,0,0,0.4);
	border:1px solid rgba(255,255,255,0.15);
	position:relative;
	z-index:1;
	animation:fadeIn 1s ease;
}

@keyframes fadeIn{
	from{
		opacity:0;
		transform:translateY(40px);
	}
	to{
		opacity:1;
		transform:translateY(0);
	}
}

.container h1{
	text-align:center;
	color:white;
	font-size:32px;
	margin-bottom:35px;
	font-weight:600;
	line-height:1.4;
}

/* Input Group */

.input-group{
	position:relative;
	margin-bottom:25px;
}

.input-group i{
	position:absolute;
	top:17px;
	left:15px;
	color:#ddd;
	font-size:16px;
}

.input-group input{
	width:100%;
	padding:15px 15px 15px 48px;
	border:none;
	outline:none;
	border-radius:12px;
	background:rgba(255,255,255,0.15);
	color:white;
	font-size:15px;
	transition:0.3s;
}

.input-group input::placeholder{
	color:#ddd;
}

.input-group input:focus{
	background:rgba(255,255,255,0.22);
	transform:scale(1.02);
	box-shadow:0 0 12px rgba(255,255,255,0.2);
}

/* Submit Button */

.btn{
	width:100%;
	padding:15px;
	border:none;
	border-radius:14px;
	background:linear-gradient(135deg,#00c6ff,#0072ff);
	color:white;
	font-size:18px;
	font-weight:600;
	cursor:pointer;
	transition:0.4s;
}

.btn:hover{
	transform:translateY(-4px);
	box-shadow:0 10px 20px rgba(0,114,255,0.4);
}

/* Bottom Text */

.bottom-text{
	text-align:center;
	margin-top:20px;
	color:#ddd;
	font-size:14px;
	line-height:1.5;
}

/* Navigation Buttons */

.nav-buttons{
	display:flex;
	justify-content:center;
	gap:15px;
	margin-top:25px;
	flex-wrap:wrap;
}

.nav-buttons a{
	text-decoration:none;
	padding:12px 22px;
	border-radius:12px;
	color:white;
	font-size:15px;
	font-weight:500;
	transition:0.4s;
	display:flex;
	align-items:center;
	justify-content:center;
	gap:8px;
	min-width:150px;
	text-align:center;
}

.back-btn{
	background:linear-gradient(135deg,#ff9966,#ff5e62);
}

.home-btn{
	background:linear-gradient(135deg,#11998e,#38ef7d);
}

.nav-buttons a:hover{
	transform:translateY(-4px) scale(1.05);
	box-shadow:0 10px 20px rgba(0,0,0,0.3);
}

/* RESPONSIVE */

@media(max-width:768px){

	body{
		padding:15px;
		align-items:flex-start;
		padding-top:80px;
	}

	.container{
		padding:35px 25px;
		border-radius:22px;
	}

	.container h1{
		font-size:28px;
		margin-bottom:30px;
	}

	.marquee span{
		font-size:30px;
	}

}

@media(max-width:480px){

	body{
		padding:12px;
		padding-top:70px;
	}

	.container{
		padding:28px 18px;
		border-radius:20px;
	}

	.container h1{
		font-size:24px;
		margin-bottom:25px;
	}

	.input-group{
		margin-bottom:20px;
	}

	.input-group input{
		padding:14px 14px 14px 45px;
		font-size:14px;
	}

	.input-group i{
		top:16px;
		left:14px;
		font-size:15px;
	}

	.btn{
		font-size:16px;
		padding:14px;
	}

	.nav-buttons{
		flex-direction:column;
		gap:12px;
	}

	.nav-buttons a{
		width:100%;
		font-size:14px;
		padding:13px 15px;
	}

	.bottom-text{
		font-size:13px;
	}

	.marquee span{
		font-size:22px;
	}

	body::before{
		width:250px;
		height:250px;
	}

	body::after{
		width:220px;
		height:220px;
	}

}

</style>

</head>

<body>

<div class="marquee">
	<span>ShopSphere</span>
</div>

<div class="container">

	<h1>
		<i class="fa-solid fa-box-open"></i>
		Add Product
	</h1>

	<form action="addproduct" method="post">

		<div class="input-group">
			<i class="fa-solid fa-barcode"></i>
			<input type="text"
			name="pcode"
			placeholder="Enter Product Code"
			required>
		</div>

		<div class="input-group">
			<i class="fa-solid fa-tag"></i>
			<input type="text"
			name="pname"
			placeholder="Enter Product Name"
			required>
		</div>

		<div class="input-group">
			<i class="fa-solid fa-building"></i>
			<input type="text"
			name="pcmpny"
			placeholder="Enter Product Company"
			required>
		</div>

		<div class="input-group">
			<i class="fa-solid fa-indian-rupee-sign"></i>
			<input type="text"
			name="pprice"
			placeholder="Enter Product Price"
			required>
		</div>

		<div class="input-group">
			<i class="fa-solid fa-layer-group"></i>
			<input type="text"
			name="pqty"
			placeholder="Enter Product Quantity"
			required>
		</div>

		<input type="submit"
		value="Add Product"
		class="btn">

	</form>

	<div class="bottom-text">
		Product Management System
	</div>

	<div class="nav-buttons">

		<a href="javascript:history.back()"
		class="back-btn">

			<i class="fa-solid fa-arrow-left"></i>

			Go Back

		</a>

		<a href="AdminHome.jsp"
		class="home-btn">

			<i class="fa-solid fa-house"></i>

			Home

		</a>

	</div>

</div>

</body>
</html>
